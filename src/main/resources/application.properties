spring.config.import=optional:file:env.properties
spring.application.name=holiday-home-manager
server.port=${PORT:3001}

# POSTGRES
spring.datasource.url=jdbc:postgresql://localhost:5432/${PG_DB_NAME}
spring.datasource.username=${PG_USERNAME}
spring.datasource.password=${PG_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CLOUDINARY (upload foto appartamenti)
cloudinary.name=${CLOUDINARY_CLOUD_NAME}
cloudinary.apiKey=${CLOUDINARY_API_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}

# JWT
jwt.secret=${JWT_SECRET}

# BREVO (invio email transazionali con la chiave digitale)
brevo.apiKey=${BREVO_API_KEY}
brevo.senderEmail=${BREVO_SENDER_EMAIL}
brevo.senderName=${BREVO_SENDER_NAME:Holiday Home Manager}

# Struttura
property.mainEntranceLabel=${MAIN_ENTRANCE_LABEL:Portone principale}
property.totalApartments=${TOTAL_APARTMENTS:16}
